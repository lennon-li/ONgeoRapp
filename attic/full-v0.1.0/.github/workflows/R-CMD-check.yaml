name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:

# The DESCRIPTION carries `Remotes: lennon-li/ONgeoR`, so
# setup-r-dependencies installs ONgeoR from its GitHub tip rather than from a
# release. That is deliberate: it is what keeps the testServer suite running
# against current ONgeoR source, which is the property that caught the
# 2026-07-30 point-to-point defect before the split.

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: release}
          - {os: windows-latest, r: release}
          - {os: macos-latest, r: release}

    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
